<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F4F8FA" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Aerolytics — UK Wind Generation Procurement Intelligence & Day-Ahead Forecast Analytics" />
    <title>Aerolytics | UK Wind Procurement Intelligence</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('wind-theme');
          var isDark = false;
          if (stored === 'light') {
            isDark = false;
          } else if (stored === 'dark') {
            isDark = true;
          } else if (stored === 'system') {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } else {
            isDark = true; // Default to signature dark mode
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
